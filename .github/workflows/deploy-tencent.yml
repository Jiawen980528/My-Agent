name: Deploy Tencent
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deploy-tencent.yml'
      - 'ops/**'
permissions:
  contents: read
concurrency:
  group: tencent-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend and package code only
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          mkdir -p payload/frontend
          cp -a backend/app payload/app
          cp -a frontend/dist payload/static
          cp frontend/package.json payload/frontend/package.json
          cp backend/pyproject.toml payload/pyproject.toml
          cp scripts/generate_manifest.py payload/generate_manifest.py
          cp -a external/myagent-service/app payload/myagent_app
          cp external/myagent-service/requirements.txt payload/myagent_requirements.txt
          git rev-parse HEAD:external/myagent-service/app > payload/myagent-source-id
          tar -C payload -czf code.tar.gz .
          sha256sum code.tar.gz > code.tar.gz.sha256
          du -h code.tar.gz
      - name: Upload code and deploy with existing server dependencies
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_USER" = myagent-deploy
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          target="$DEPLOY_USER@$DEPLOY_HOST"
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          ssh "${opts[@]}" "$target" "mkdir -p /home/myagent-deploy/releases/$GITHUB_SHA"
          scp "${opts[@]}" code.tar.gz code.tar.gz.sha256 "$target:/home/myagent-deploy/releases/$GITHUB_SHA/"
          ssh "${opts[@]}" "$target" "sudo -n /usr/local/sbin/myagent-deploy $GITHUB_SHA"
