<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>持仓实时监控 · MyAgent</title>
<style>
:root{color-scheme:dark;font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;background:#080e17;color:#dae6f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{height:100vh;display:flex;flex-direction:column;overflow:hidden}header{background:#0d1725;border-bottom:1px solid #274059;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{font-size:18px}header small,.muted{color:#8da4b9}header nav{margin-left:auto;display:flex;gap:8px}a{color:#72b6ff;text-decoration:none}a:hover{text-decoration:underline}.tag{border:1px solid #35516a;padding:3px 7px;border-radius:4px;color:#9fbed6}.top{display:grid;grid-template-columns:repeat(8,minmax(100px,1fr));gap:7px;padding:10px 12px;background:#0b1420}.metric{background:#121f2d;border:1px solid #263c50;border-radius:5px;padding:9px;min-width:0}.metric small{display:block;color:#91a9bd}.metric strong{display:block;font-size:18px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{padding:6px 12px;color:#efbb6d;background:#312513;border-top:1px solid #6e532d;border-bottom:1px solid #6e532d}.body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 290px;gap:8px;padding:8px}.panel{border:1px solid #263c50;background:#0d1927;border-radius:5px;min-height:0;overflow:auto}.panel h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid #2b4055}.toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;flex-wrap:wrap}.toolbar button,.toolbar input{border:1px solid #34506a;background:#14263a;color:#dbe9f7;border-radius:4px;padding:5px 8px}.toolbar button.active,.pick.active{background:#2465aa;color:white}.pick{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #213447;color:#dbe8f5;padding:10px}.pick:hover{background:#192c40}.pick span{display:block;color:#91a9bd;font-size:12px}.pick strong{font-size:15px}.up{color:#ff6371}.down{color:#27c99b}.middle{min-width:0;overflow:auto}.plot-card{background:#0d1927;border:1px solid #263c50;border-radius:5px;margin-bottom:8px;padding:9px}.plot-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.plot-title h2{font-size:16px;margin:2px 0}.plot-title small{color:#8ba9bf}canvas{width:100%;height:300px;display:block;touch-action:none}.board canvas{height:195px}.detail{display:flex;gap:14px;flex-wrap:wrap;padding:6px 2px;color:#9eb6cb}.detail b{color:#e5f0fb}.right input{background:#101f30;border:1px solid #38536b;color:#e5f0fb;padding:5px;width:125px}.right button{background:#2465aa;color:#fff;border:0;border-radius:4px;padding:7px 10px}.right .block{padding:10px;border-bottom:1px solid #274059}.right h3{margin:0 0 8px;font-size:14px}.right p{margin:5px 0}.right .block strong{font-size:17px}.grid{display:none;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:8px;padding:8px;overflow:auto}.grid.active{display:grid}.grid canvas{height:130px}.grid .plot-card{margin:0;cursor:pointer}.grid small{display:block;color:#92a9bd}.middle.hidden{display:none}.foot{padding:8px 12px;background:#0d1927;border:1px solid #263c50;border-radius:5px;margin-top:8px}.foot table{width:100%;border-collapse:collapse}.foot th,.foot td{border-bottom:1px solid #263c50;padding:6px;text-align:left}.empty{color:#8ba5ba;padding:20px;text-align:center}.error{color:#ff6f7a}.source{color:#86a5bf;font-size:12px}#syncState{font-size:12px;color:#9cb5c8}@media(max-width:980px){.top{grid-template-columns:repeat(4,1fr)}.body{grid-template-columns:210px 1fr}.right{grid-column:1/-1}.middle{min-height:600px}}@media(max-width:650px){.shell{height:auto;min-height:100vh;overflow:visible}.top{grid-template-columns:repeat(2,1fr)}.body{display:block}.panel{margin-bottom:8px}.left{max-height:190px}.middle{overflow:visible}.grid{grid-template-columns:1fr}header nav{margin-left:0}canvas{height:250px}}
</style></head><body><div class="shell"><header><b>▦ MyAgent · 持仓监控</b><span id="syncState">正在连接行情…</span><nav><a href="/">返回工作台</a><a href="/quant/">量化终端</a></nav></header>
<section class="top" id="metrics"></section><div class="notice" id="notice">七只是初始监控标的；账户持仓与资产以实际导入或授权同步为准。</div>
<section class="body"><aside class="panel left"><h2>监控标的 / 已记录持仓</h2><div class="toolbar"><button id="singleBtn" class="active">单只详情</button><button id="gridBtn">全部监控</button></div><div id="holdings"></div></aside>
<main class="middle" id="single"><div class="plot-card"><div class="plot-title"><div><h2 id="stockTitle">选择证券</h2><small id="stockMeta">TickFlow Pro · 北京时间</small></div><button id="fullBtn">放大</button></div><div class="toolbar"><input id="day" type="date"><span id="periods"></span><label><input id="ma5" type="checkbox" checked>MA5</label><label><input id="ma10" type="checkbox">MA10</label><label><input id="ma20" type="checkbox">MA20</label></div><canvas id="stockCanvas"></canvas><div class="detail" id="stockDetail"></div></div>
<div class="plot-card board"><div class="plot-title"><div><h2 id="boardTitle">关联板块</h2><small id="boardMeta">来源待确认</small></div></div><canvas id="boardCanvas"></canvas><div class="detail" id="boardDetail"></div></div>
<div class="foot"><strong>11月6日交易与做T复盘</strong><p class="source">成交点由用户提供，尚未与券商成交回报核对；历史行情来自 TickFlow Pro。</p><div id="trades" class="empty">选择两只核心ETF查看</div></div></main>
<aside class="panel right"><h2>资金流与做T诊断</h2><div class="block" id="flowBox"><h3>板块资金流向</h3>加载中…</div><div class="block" id="signalBox"><h3>行情观察</h3><p class="muted">选择证券查看</p></div><div class="block" id="accountBox"><h3>手工持仓（可选）</h3><p class="muted">券商账户暂不接入。手工数量与成本可随 TickFlow 行情估算市值，不标为实时账户数据。</p><p><label>持仓数量 <input id="holdingQty" type="number" min="0" step="1" placeholder="份/股"></label></p><p><label>可卖数量 <input id="holdingAvailable" type="number" min="0" step="1" placeholder="份/股"></label></p><p><label>成本价 <input id="holdingCost" type="number" min="0" step="0.001" placeholder="元"></label></p><button id="saveHolding">保存所选证券</button><p id="holdingMessage" class="source"></p><p class="muted">当前阶段只做分析，不执行交易。</p></div></aside></section><section class="grid" id="grid"></section></div>
<script>
const $=id=>document.getElementById(id), fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}), sign=v=>v==null?'':v>=0?'up':'down', esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={items:[],selected:'159558.SZ',period:1,minute:null,board:null,minuteCache:{},boardCache:{}};const cn=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));const live=()=>{let d=cn(),m=d.getHours()*60+d.getMinutes();return d.getDay()>0&&d.getDay()<6&&m>=570&&m<=900};const marketDate=()=>{let d=cn();while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d.toLocaleDateString('sv-SE')};$('day').value=marketDate();
async function api(url){let r=await fetch(url,{credentials:'same-origin'});let j=await r.json();if(!r.ok)throw Error(j.detail||'HTTP '+r.status);return j}
function metrics(account){let cells=[['总资产',account.total_assets],['持仓总市值',account.market_value_recorded],['可用资金',account.cash_available],['今日盈亏估算',account.today_pnl_estimate],['累计浮盈亏估算',account.total_pnl_estimate],['仓位',account.position_ratio],['选中做T价差',state.minute?.replay?.matched_t_pnl],['累计做T',null]];$('metrics').innerHTML=cells.map(([k,v])=>`<div class="metric"><small>${k}</small><strong class="${sign(v)}">${fmt(v)}</strong></div>`).join('')}
function renderList(){let s=state.selected;$('holdings').innerHTML=state.items.map(x=>`<button class="pick ${x.symbol===s?'active':''}" data-symbol="${x.symbol}"><strong>${esc(x.name)}</strong><span>${x.symbol} · ${x.holding_source?'手工持仓 '+fmt(x.quantity,0)+' · 成本 '+fmt(x.cost,3):'监控标的，持仓未核实'}</span><span class="${sign(x.change_pct)}">${fmt(x.price,3)}　${x.change_pct==null?'—':(x.change_pct>=0?'+':'')+fmt(x.change_pct)+'%'}</span></button>`).join('');$('holdings').querySelectorAll('.pick').forEach(b=>b.onclick=()=>select(b.dataset.symbol))}
function aggregate(rows,n){if(n===1)return rows;let out=[];for(let i=0;i<rows.length;i+=n){let group=rows.slice(i,i+n),first=group[0],last=group.at(-1);out.push({datetime:last.datetime,open:first.open,high:Math.max(...group.map(x=>x.high)),low:Math.min(...group.map(x=>x.low)),close:last.close,volume:group.reduce((a,x)=>a+Number(x.volume||0),0),amount:group.reduce((a,x)=>a+Number(x.amount||0),0)})}return out}
function draw(canvas,rows,opts={}){let box=canvas.getBoundingClientRect(),ratio=devicePixelRatio||1,w=Math.max(300,box.width),h=box.height;canvas.width=w*ratio;canvas.height=h*ratio;let c=canvas.getContext('2d');c.scale(ratio,ratio);c.fillStyle='#0c1a29';c.fillRect(0,0,w,h);if(!rows?.length){c.fillStyle='#8ca6bb';c.font='14px sans-serif';c.fillText('该日期暂无真实分钟行情',20,36);return}let left=42,right=12,top=18,bottom=opts.small?18:48,graphH=h-top-bottom,prices=rows.map(x=>Number(x.close)),mn=Math.min(...prices,...rows.map(x=>Number(x.low||x.close))),mx=Math.max(...prices,...rows.map(x=>Number(x.high||x.close))),pad=(mx-mn)*.08||.01;mn-=pad;mx+=pad;let xx=i=>left+(w-left-right)*i/Math.max(1,rows.length-1),yy=v=>top+graphH*(mx-v)/(mx-mn);c.strokeStyle='#263a50';c.lineWidth=1;for(let i=0;i<4;i++){let y=top+graphH*i/3;c.beginPath();c.moveTo(left,y);c.lineTo(w-right,y);c.stroke();if(!opts.small){c.fillStyle='#8aa4b8';c.font='11px sans-serif';c.fillText(fmt(mx-(mx-mn)*i/3,3),2,y+3)}}let line=(vals,color,width=1.5)=>{c.strokeStyle=color;c.lineWidth=width;c.beginPath();vals.forEach((v,i)=>{if(v==null)return;i?c.lineTo(xx(i),yy(v)):c.moveTo(xx(i),yy(v))});c.stroke()};line(prices,'#54a3ff',2);if(!opts.small){let totalA=0,totalV=0,avg=rows.map(r=>{totalA+=Number(r.amount||0);totalV+=Number(r.volume||0);return totalV?totalA/(totalV*100):null});if(!opts.board)line(avg,'#f3b65c');for(let n of [5,10,20])if($('ma'+n).checked&&!opts.board){let ma=rows.map((_,i)=>i<n-1?null:rows.slice(i-n+1,i+1).reduce((a,x)=>a+Number(x.close),0)/n);line(ma,n===5?'#bb78ee':n===10?'#46d1b2':'#ffda79',1)}let maxV=Math.max(...rows.map(x=>Number(x.volume||0)),1);rows.forEach((r,i)=>{let bh=Number(r.volume||0)/maxV*30;c.fillStyle=Number(r.close)>=Number(r.open)?'#a73c54':'#138970';c.fillRect(xx(i)-1.5,h-40-bh,3,bh)});for(let t of opts.trades||[]){let i=rows.findIndex(r=>r.datetime.slice(11,16)===t.datetime.slice(11,16));if(i<0)continue;c.fillStyle=t.side==='buy'?'#ff6680':'#2cdda7';c.beginPath();c.arc(xx(i),yy(t.price),5,0,7);c.fill()}c.fillStyle='#90a9bd';c.font='11px sans-serif';c.fillText(rows[0].datetime.slice(11,16),left,h-6);c.fillText(rows.at(-1).datetime.slice(11,16),w-45,h-6)}canvas.onpointermove=e=>{let i=Math.round((e.clientX-box.left-left)/(w-left-right)*(rows.length-1));i=Math.max(0,Math.min(rows.length-1,i));canvas.title=`${rows[i].datetime} 价格 ${fmt(rows[i].close,3)} 成交量 ${fmt(rows[i].volume,0)}`};}
function renderCharts(){let data=state.minute,board=state.board,rows=aggregate(data?.rows||[],state.period);$('stockTitle').textContent=(state.items.find(x=>x.symbol===state.selected)?.name||state.selected)+' · '+state.selected;$('stockMeta').textContent=(data?.source||'TickFlow Pro')+' · 最后行情 '+(data?.last_market_time||'暂无')+' · '+(live()?'交易中':'非交易时段');draw($('stockCanvas'),rows,{trades:data?.replay?.trades||[]});let last=rows.at(-1);$('stockDetail').innerHTML=last?`现价 <b>${fmt(last.close,3)}</b>　最高 <b>${fmt(Math.max(...rows.map(x=>x.high)),3)}</b>　最低 <b>${fmt(Math.min(...rows.map(x=>x.low)),3)}</b>　成交量 <b>${fmt(last.volume,0)} 手</b>`:'暂无行情';$('boardTitle').textContent=(board?.board?.name||'关联板块')+' · '+(board?.board?.code||'待绑定');$('boardMeta').textContent=(board?.source||'暂无数据源')+' · 最后行情 '+(board?.last_market_time||'暂无');draw($('boardCanvas'),board?.rows||[],{board:true});let b=board?.rows?.at(-1),f=board?.flow?.at(-1);$('boardDetail').innerHTML=b?`收盘/最新 <b>${fmt(b.close,2)}</b>　成交额 <b>${fmt(b.amount/1e8,2)} 亿</b>`:'板块分时暂不可用';$('flowBox').innerHTML=`<h3>板块资金流向</h3>${f?`<strong class="${sign(f.main_yi)}">主力 ${fmt(f.main_yi,3)} 亿</strong><p>超大单 ${fmt(f.super_yi,3)} 亿 · 大单 ${fmt(f.big_yi,3)} 亿</p><p>中单 ${fmt(f.medium_yi,3)} 亿 · 小单 ${fmt(f.small_yi,3)} 亿</p><small class="source">${board.flow_source} · ${f.datetime}；供应商统计口径，不与其他来源混算</small>`:`<p class="muted">${board?.flow_status||'数据源未接入'}</p>`}`;let ma5=rows.length>=5?rows.slice(-5).reduce((a,x)=>a+x.close,0)/5:null;$('signalBox').innerHTML=`<h3>行情观察</h3><p>最近5根均价：${fmt(ma5,3)}　当前价：${fmt(last?.close,3)}</p><p>近20根低点：${rows.length?fmt(Math.min(...rows.slice(-20).map(x=>x.low)),3):'—'}</p><p>近20根高点：${rows.length?fmt(Math.max(...rows.slice(-20).map(x=>x.high)),3):'—'}</p><small class="source">观察依据：已完成分钟K；更新时间 ${data?.last_market_time||'—'}；下一根行情可能使观察失效。仅供研究。</small>`;renderReplay(data?.replay)}
function renderReplay(r){if(!r){$('trades').innerHTML='<span class="muted">仅两只核心ETF有用户提供的11月6日成交记录；其他证券待导入交割单。</span>';return}$('trades').innerHTML=`<p>成交记录 ${r.trades.length} 笔 · 已配对 ${fmt(r.matched_t_qty,0)} 份 · 做T价差 <b class="${sign(r.matched_t_pnl)}">${fmt(r.matched_t_pnl)} 元</b> · 额外加仓 ${fmt(r.extra_qty,0)} 份 · 佣金 ${fmt(r.fees)} 元</p><p>相对不交易（收盘估值）<b class="${sign(r.versus_no_trade)}">${fmt(r.versus_no_trade)} 元</b>，其中额外仓位影响 ${fmt(r.extra_position_mark_to_close)} 元。该对照不等于账户总盈亏。</p><table><thead><tr><th>时间</th><th>方向</th><th>数量</th><th>价格</th><th>佣金</th></tr></thead><tbody>${r.trades.map(t=>`<tr><td>${t.datetime.slice(11,16)}</td><td>${t.side==='buy'?'买入':'卖出'}</td><td>${fmt(t.qty,0)}</td><td>${fmt(t.price,3)}</td><td>${fmt(t.fee)}</td></tr>`).join('')}</tbody></table>`}
async function refreshSnapshot(){try{let j=await api('/api/quant/portfolio/snapshot');state.items=j.items;renderList();metrics(j.account);$('notice').textContent=j.notice;$('syncState').textContent=(live()?'行情轮询中':'已收盘 · 显示最后有效行情')+' · '+j.source;if(!state.minute)await select(state.selected)}catch(e){$('syncState').textContent='行情连接失败：'+e.message}}
async function select(symbol){state.selected=symbol;renderList();let holding=state.items.find(x=>x.symbol===symbol);$('holdingQty').value=holding?.quantity??'';$('holdingAvailable').value=holding?.available_quantity??'';$('holdingCost').value=holding?.cost??'';let day=$('day').value;try{let [m,b]=await Promise.all([api(`/api/quant/portfolio/minute/${symbol}?trade_date=${day}`),api(`/api/quant/portfolio/board/${symbol}?trade_date=${day}`)]);if(state.selected!==symbol)return;state.minute=m;state.board=b;state.minuteCache[symbol]=m;state.boardCache[symbol]=b;renderCharts();if($('grid').classList.contains('active'))renderGrid()}catch(e){$('stockMeta').textContent='数据读取失败：'+e.message;state.minute=null;renderCharts()}}
function renderGrid(){let g=$('grid');g.innerHTML=state.items.map(x=>`<div class="plot-card" data-symbol="${x.symbol}"><b>${esc(x.name)}</b><small>${x.symbol} · ${fmt(x.price,3)} · ${esc(x.board?.name||'板块待绑定')}</small><canvas></canvas><small>关联板块分时</small><canvas></canvas></div>`).join('');g.querySelectorAll('.plot-card').forEach((card,i)=>{card.onclick=()=>{showSingle();select(card.dataset.symbol)};let x=state.items[i],r=state.minuteCache[x.symbol]?.rows||[];draw(card.querySelectorAll('canvas')[0],r,{small:true});draw(card.querySelectorAll('canvas')[1],state.boardCache[x.symbol]?.rows||[],{small:true,board:true})})}
async function loadGrid(){let day=$('day').value;try{let batch=await api(`/api/quant/portfolio/minute-batch?trade_date=${day}`);for(let x of state.items){let rows=batch.data?.[x.symbol]||[];state.minuteCache[x.symbol]={source:batch.source,rows,last_market_time:rows.at(-1)?.datetime||null};if($('grid').classList.contains('active'))renderGrid()}}catch(e){$('syncState').textContent='批量分钟行情暂不可用：'+e.message}for(let x of state.items){if(!state.boardCache[x.symbol]){try{state.boardCache[x.symbol]=await api(`/api/quant/portfolio/board/${x.symbol}?trade_date=${day}`)}catch(e){}}if($('grid').classList.contains('active'))renderGrid()}}
function showSingle(){ $('single').classList.remove('hidden');$('grid').classList.remove('active');$('singleBtn').classList.add('active');$('gridBtn').classList.remove('active');renderCharts()}
$('saveHolding').onclick=async()=>{let x=state.items.find(v=>v.symbol===state.selected),qty=Number($('holdingQty').value),available=$('holdingAvailable').value===''?qty:Number($('holdingAvailable').value),cost=Number($('holdingCost').value);if(!x||!Number.isInteger(qty)||qty<0||!Number.isInteger(available)||available<0||cost<0||$('holdingQty').value===''){$('holdingMessage').textContent='请填写有效数量和成本';return}try{let r=await fetch('/api/quant/holdings/'+x.symbol.slice(0,6),{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:x.symbol.slice(0,6),name:x.name,quantity:qty,available_quantity:available,cost:cost,source:'manual'})});if(!r.ok)throw Error('保存失败 '+r.status);$('holdingMessage').textContent='已保存为手工记录';await refreshSnapshot()}catch(e){$('holdingMessage').textContent=e.message}};$('singleBtn').onclick=showSingle;$('gridBtn').onclick=()=>{$('single').classList.add('hidden');$('grid').classList.add('active');$('gridBtn').classList.add('active');$('singleBtn').classList.remove('active');renderGrid();loadGrid()};$('fullBtn').onclick=()=>{let el=$('single');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};$('day').onchange=()=>{state.minuteCache={};state.boardCache={};select(state.selected);if($('grid').classList.contains('active'))loadGrid()};for(let n of [5,10,20])$('ma'+n).onchange=renderCharts;const periods=$('periods');for(let n of [1,5,15,30,60]){let b=document.createElement('button');b.textContent=n+'分';b.className=n===1?'active':'';b.onclick=()=>{state.period=n;periods.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCharts()};periods.append(b)}window.onresize=()=>{renderCharts();if($('grid').classList.contains('active'))renderGrid()};refreshSnapshot();setInterval(()=>{if(live())refreshSnapshot()},6000);setInterval(()=>{if(live()){if($('grid').classList.contains('active'))loadGrid();else select(state.selected)}},30000);
</script></body></html>
